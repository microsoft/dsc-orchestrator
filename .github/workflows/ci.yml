name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run CI checks
        run: ./build/Invoke-CI.ps1 -ResultsDirectory "$env:RUNNER_TEMP\dsc-orchestrator-ci"

      - name: Upload NUnit test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.shell }}
          path: ${{ runner.temp }}\dsc-orchestrator-ci\testResults.xml
          if-no-files-found: warn
